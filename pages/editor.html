<!doctype html>
<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <link rel="stylesheet" type="text/css" href="../global-resources/style.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="../global-resources/script.js"></script>
    <script src="editor.js"></script>
  </head>
  <body>
    <nav class="list-area">
      <button id="btnAdd">+ Add hostname</button>
      <ul id="siteList"></ul>
    </nav>
    <main class="editor-area">
      <h1 id="siteName"></h1>
      <div class="button-area">
        <label class="enabled-toggle"><input type="checkbox" id="chkEnabled"> Enabled</label>
        <button id="btnSave">Save</button>
        <button id="btnRename" class="neutral">Rename</button>
        <button id="btnDelete" class="error">Delete</button>
      </div>
      <p id="status" class="status hidden" role="alert"></p>
      <div class="style-areas">
        <label class="style-area">
          <span class="style-title">default</span>
          <span class="style-hint">Competes with the page's CSS by specificity.</span>
          <textarea id="styleData" wrap="soft" spellcheck="false"></textarea>
        </label>
        <label class="style-area">
          <span class="style-title">!important</span>
          <span class="style-hint">Beats all page CSS, but only for declarations marked <code>!important</code>. Declarations without it lose to every page style.</span>
          <textarea id="importantStyleData" wrap="soft" spellcheck="false"></textarea>
        </label>
      </div>
    </main>
  </body>
</html>
